{% load static %}<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesso referenti — Fucina Salentina APS</title>
<link rel="stylesheet" href="{% static 'anagrafica/style.css' %}">
<style>
    input[type="password"] {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 0.95rem;
        color: #333;
        outline: none;
        background-color: white;
        box-sizing: border-box;
    }
    input[type="password"]:focus {
        border-color: #417690;
        box-shadow: 0 0 0 3px rgba(65,118,144,0.1);
    }
</style>
</head>
<body>
<div class="card">
    <div class="logo">
        <img src="{% static 'anagrafica/logo-fucina.jpeg' %}" alt="Fucina Salentina"
             style="width:120px; height:auto; margin-bottom:12px;">
        <p>Accesso riservato ai referenti</p>
    </div>
    {% if form.errors %}
    <div style="background:#ffebee; border:1px solid #ef9a9a; border-radius:8px; padding:12px 16px; margin-bottom:18px; color:#c62828;">
        ❌ Username o password non corretti.
    </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" autofocus required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Accedi</button>
    </form>
</div>
</body>
</html>
